services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: vecgate_admin
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: vecgate
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vecgate_admin -d vecgate"]
      interval: 5s
      timeout: 5s
      retries: 5

  vecgate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      VECGATE_DATABASE_URL: postgresql://vecgate_admin:changeme@db/vecgate
      VECGATE_ADMIN_DATABASE_URL: postgresql://vecgate_admin:changeme@db/vecgate
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "vecgate init --db-url $$VECGATE_ADMIN_DATABASE_URL &&
             vecgate serve --host 0.0.0.0 --port 8000"
