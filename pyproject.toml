[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vecgate"
version = "0.1.0"
description = "ACL-controlled vector search for pgvector — two-layer RBAC in one SQL query"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["vector", "pgvector", "acl", "rbac", "semantic-search", "postgresql"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.1",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
cli = [
    "typer>=0.12",
    "rich>=13.0",
]
service = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "vecgate[cli,service]",
]
all = ["vecgate[cli,service]"]

[project.scripts]
vecgate = "vecgate.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/vecgate"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.envs.default]
features = ["dev"]
